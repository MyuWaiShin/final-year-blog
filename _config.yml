# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

# The language of the webpage
lang: en

# Change to your timezone
timezone: Europe/London

# jekyll-seo-tag settings
title: Final Year Project - Recovery Strategies for Robotic Manipulation
tagline: Building Robust Robotic Systems
description: >-
  This research systematically evaluates failure recovery strategies in robotic pick-and-place operations. 
  Controlled experiments are conducted using a UR10 manipulator with gripper to quantify recovery effectiveness 
  across different failure modes.

# Fill in the protocol & hostname for your site
url: "https://myuwaishin.github.io"

github:
  username: MyuWaiShin

social:
  name: Myu Wai Shin
  email: myuwaishin10@gmail.com
  links:
    - https://github.com/MyuWaiShin
    - https://www.linkedin.com/in/myu-wai-shin-0bb3b2295/

theme_mode: # [light | dark]

cdn:

avatar: /assets/img/avatar.jpg

social_preview_image:

toc: true

comments:
  provider:

assets:
  self_host:
    enabled:

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:

paginate: 10

baseurl: "/final-year-blog"

# ------------ The following options are not recommended to be modified ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/